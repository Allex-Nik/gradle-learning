plugins {
    alias(libs.plugins.app) // https://docs.gradle.org/current/userguide/application_plugin.html
    alias(libs.plugins.shadow) // https://plugins.gradle.org/plugin/com.gradleup.shadow
    alias(libs.plugins.slack)
}

application {
    mainClass = 'org.education.Main'
}

dependencies {
    implementation(projects.module1)
}

// Cross-project configuration
// https://docs.gradle.org/current/userguide/glossary.html#sub:terminology_cross_project_configuration
subprojects {
    apply plugin: 'java'

    group = 'org.education'
    version = libs.versions.release

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupyter
        testRuntimeOnly libs.junit.platform.launcher
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    test {
        useJUnitPlatform() // https://www.petrikainulainen.net/programming/testing/junit-5-tutorial-running-unit-tests-with-gradle/
    }
}

tasks.register('info') {
    doLast {
        println "Java: ${System.getProperty('java.version')}"
        println "Gradle: ${gradle.gradleVersion}"
    }
}

slack {
    token = System.getenv("SLACK_TOKEN")
    channel = System.getenv("SLACK_CHANNEL")
    message = "Build is running"
}

run.dependsOn(sendSlackMessage)
